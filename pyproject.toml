[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-optimizer"
version = "0.1.0"
description = "RoPE-aware function-space preconditioning for Muon query/key updates"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alexandru Pop"}]
keywords = ["optimization", "transformers", "RoPE", "Muon", "PyTorch", "attention"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
experiments = [
  "datasets>=3,<5",
  "transformers>=4.56,<5",
]

[project.urls]
Repository = "https://github.com/pop123-ux/ORBIT"
Issues = "https://github.com/pop123-ux/ORBIT/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
