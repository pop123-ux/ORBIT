name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Syntax
        run: python -m compileall -q src/orbit examples experiments tests
      - name: Tests
        run: pytest -q
      - name: Experiment CLI
        run: |
          python experiments/run.py --help
          python experiments/paper_run.py --help
          python experiments/matched.py candidates > /tmp/orbit-matched-candidates.json
      - name: Examples
        run: |
          python examples/quickstart.py
          python examples/toy_baseline_step.py
          python examples/toy_compare.py --steps 2

  minimum-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimum supported PyTorch line
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.2.2" --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
